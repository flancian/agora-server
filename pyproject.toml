[project]
name = "agora-server"
version = "0.1.0"
description = ""
authors = [{ name = "Null Flancian", email = "0@flancia.org" }]
requires-python = ">=3.9"
dependencies = [
    "bleach>=6.0.0",
    "cachetools>=5.3.1",
    "dateparser>=1.1.8",
    "feedgen>=0.9.0",
    "feedparser>=6.0.10",
    "flask>=2.3.2",
    "flask-compress>=1.13",
    "Flask-Cors",
    "flask-wtf>=1.1.1",
    "google-generativeai>=0.7.2",
    "gunicorn>=23.0.0",
    "jsons>=1.6.3",
    "lxml>=4.9.2",
    "marko>=2.0.0",
    "markupsafe>=2.1.3",
    "mistralai==0.0.8",
    "objgraph>=3.6.2",
    "org-python>=0.3.2",
    "orjson",
    "pycryptodome>=3.19.0",
    "pygit2",
    "pyyaml>=6.0",
    "rdflib>=6.3.2",
    "requests>=2.31.0",
    "smartypants>=2.0.1",
    "thefuzz>=0.20.0",
    "uwsgi>=2.0.29",
    "werkzeug>=2.3.6",
    "wtforms>=3.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
semantic = [
    "sentence-transformers>=2.2.2",
    "torch",
    "numpy>=1.24.0",
    "einops>=0.8.2",
]

# [build-system]
# requires = ["hatchling"]
# build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
