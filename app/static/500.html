<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="10" />
    <title>Agora - Server Resting (502/500)</title>
    <style>
        body {
            font-family: 'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #212529;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #121212;
                color: #e0e0e0;
            }
        }
        .container {
            background-color: rgba(128, 128, 128, 0.08);
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 2.5em;
            max-width: 520px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        @media (prefers-color-scheme: dark) {
            .container {
                border-color: #333;
                box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            }
        }
        h1 {
            margin-top: 0;
            font-size: 1.8em;
        }
        p {
            line-height: 1.6;
            margin: 1em 0;
        }
        button {
            margin-top: 1.2em;
            padding: 10px 24px;
            font-size: 1em;
            cursor: pointer;
            border: 1px solid #aaa;
            border-radius: 6px;
            background: transparent;
            color: inherit;
            transition: background 0.2s, border-color 0.2s;
        }
        button:hover {
            background: rgba(128, 128, 128, 0.2);
            border-color: #666;
        }
        @media (prefers-color-scheme: dark) {
            button { border-color: #555; }
            button:hover { border-color: #888; }
        }
        .timer {
            margin-top: 1.5em;
            font-size: 0.95em;
            opacity: 0.85;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(128, 128, 128, 0.3);
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .demo-badge {
            display: inline-block;
            margin-bottom: 0.8em;
            padding: 3px 10px;
            border-radius: 12px;
            background-color: rgba(90, 140, 255, 0.15);
            color: #2b6cb0;
            font-size: 0.85em;
        }
        @media (prefers-color-scheme: dark) {
            .demo-badge {
                color: #90cdf4;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="demo-indicator" class="demo-badge" style="display: none;">🧘 Demo Mode Active</div>
        <h1>🌱 Agora Server Resting</h1>
        <p>The Agora is currently processing updates, restarting, or undergoing maintenance. Reconnecting shortly.</p>
        
        <button onclick="window.location.reload()">Retry now</button>
        
        <div class="timer">
            <span class="spinner" aria-hidden="true"></span>
            <span>Automatically retrying in <span id="countdown">8</span> seconds...</span>
        </div>
    </div>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let isDemo = false;
            try {
                isDemo = localStorage.getItem("deep-demo-active") === "true";
            } catch (e) {}

            let seconds = isDemo ? 5 : 8;
            const demoIndicator = document.getElementById("demo-indicator");
            if (isDemo && demoIndicator) {
                demoIndicator.style.display = "inline-block";
            }

            const countdownSpan = document.getElementById("countdown");
            if (countdownSpan) countdownSpan.innerText = seconds.toString();

            const interval = setInterval(() => {
                seconds--;
                if (countdownSpan) countdownSpan.innerText = seconds.toString();
                if (seconds <= 0) {
                    clearInterval(interval);
                    window.location.reload();
                }
            }, 1000);
        });
    </script>
</body>
</html>
