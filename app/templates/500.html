{% extends 'base.html' %}

{% block content %}
<div class="info-box with-spacing" style="text-align: center; margin-top: 2em; padding: 2em;">
    <div id="demo-indicator" class="demo-badge" style="display: none; margin-bottom: 0.8em; padding: 3px 10px; border-radius: 12px; background-color: rgba(90, 140, 255, 0.15); color: #2b6cb0; font-size: 0.85em;">🧘 Demo Mode Active</div>
    <h1>🌱 Agora Server Resting</h1>
    <p>The Agora is currently processing updates, restarting, or resting. Reconnecting shortly.</p>
    
    <button onclick="window.location.reload()" style="margin-top: 1em; padding: 0.6em 1.5em; cursor: pointer; border: 1px solid var(--border-color, #aaa); border-radius: 6px; background: transparent; color: inherit;">Retry now</button>

    <div style="margin-top: 1.5em; color: var(--link-color); opacity: 0.85; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <span class="resting-spinner" aria-hidden="true" style="display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(128, 128, 128, 0.3); border-top-color: currentColor; border-radius: 50%; animation: resting-spin 1.2s linear infinite;"></span>
        <em>Automatically retrying in <span id="retry-countdown">8</span> seconds...</em>
    </div>
</div>

<style>
@keyframes resting-spin {
    to { transform: rotate(360deg); }
}
</style>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        let isDemo = false;
        try {
            isDemo = localStorage.getItem("deep-demo-active") === "true";
        } catch (e) {}

        let seconds = isDemo ? 5 : 8;
        const demoIndicator = document.getElementById("demo-indicator");
        if (isDemo && demoIndicator) {
            demoIndicator.style.display = "inline-block";
        }

        const countdownSpan = document.getElementById("retry-countdown");
        if (countdownSpan) {
            countdownSpan.innerText = seconds;
            const interval = setInterval(() => {
                seconds--;
                countdownSpan.innerText = seconds;
                if (seconds <= 0) {
                    clearInterval(interval);
                    window.location.reload();
                }
            }, 1000);
        }
    });
</script>
{% endblock %}
