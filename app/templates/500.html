{% extends 'base.html' %}

{% block content %}
<div class="info-box with-spacing" style="text-align: center; margin-top: 2em; padding: 2em;">
    <h1>🌱 Agora Server Resting</h1>
    <p>The Agora is currently processing updates, restarting, or resting.</p>
    
    <button onclick="window.location.reload()" style="margin-top: 1em; padding: 0.5em 1em; cursor: pointer;">🔄 Try again now</button>

    <div style="margin-top: 1.5em; color: var(--link-color); opacity: 0.8;">
        <em>Automatically retrying in <span id="retry-countdown">8</span> seconds...</em>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        let isDemo = false;
        try {
            isDemo = localStorage.getItem("deep-demo-active") === "true";
        } catch (e) {}

        let seconds = isDemo ? 5 : 8;
        const countdownSpan = document.getElementById("retry-countdown");

        if (countdownSpan) {
            countdownSpan.innerText = seconds;
            const interval = setInterval(() => {
                seconds--;
                countdownSpan.innerText = seconds;
                if (seconds <= 0) {
                    clearInterval(interval);
                    window.location.reload();
                }
            }, 1000);
        }
    });
</script>
{% endblock %}
